[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipiline_hopifield"
version = "0.1.0"
description = "Pipeline de memória associativa Hopfield Moderna e projeção rSWeeP para dados de scRNA-seq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.10.0",
    "h5py>=3.10.0",
    "hdbscan>=0.8.39",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "polars>=1.0.0",
    "scanpy>=1.10.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
    "torch>=2.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.0",
    "jupytext>=1.16.0",
    "pandas-stubs",
    "pyrefly",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "types-tqdm",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupytext>=1.16.0",
    "pandas-stubs",
    "pyrefly",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "types-tqdm",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
typeCheckingMode = "standard"
executionEnvironments = [
  { root = "src" }
]

[tool.pyrefly]
project-includes = ["src", "pipeline_generico.py"]
search-path = [".", "src"]
infer-with-first-use = false
check-unannotated-defs = true
infer-return-types = "never"

project-excludes = [
    ".venv/**"
]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4
src = ["src", "."]
extend-exclude = [
    ".venv",
    ".pytest_cache",
    ".git",
    "__pycache__",
    "imputs",
    "outputs",
    "testeV2",
    "*.ipynb",
    "teste.ipynb",
    "ProjeçãoSweepEstavel.ipynb",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (organização de imports)
    "UP",     # pyupgrade (modernização de sintaxe)
    "B",      # flake8-bugbear (bugs comuns)
    "SIM",    # flake8-simplify (simplificações de código)
    "NPY",    # NumPy-specific rules
    "RUF",    # Ruff-specific rules
    "D",      # pydocstyle (docstrings)
]
ignore = [
    "D100",   # Missing docstring in public module (flexibilidade para arquivos raiz)
    "D104",   # Missing docstring in public package (__init__.py vazios permitidos)
    "D401",   # First line should be in imperative mood (incompatível com língua portuguesa)
    "RUF001", # Ambiguous unicode character in string (permite símbolos matemáticos como ×, β)
    "RUF002", # Ambiguous unicode character in docstring (permite termos e fórmulas em PT-BR)
    "RUF003", # Ambiguous unicode character in comment (permite acentuação e anotações científicas)
    "E501",   # Line length (delegado ao formatador do Ruff)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "D",       # Docstrings não obrigatórias em suítes de testes unitários
    "S101",    # Permitir assert em testes
]
"pipeline_*.py" = [
    "D",       # Docstrings flexíveis para scripts interativos/notebooks
    "E402",    # Permitir imports intermediários de blocos de execução
    "F401",    # Imports para checagem condicional em células de ambiente
    "F811",    # Permitir redefinição de variáveis em células
    "F821",    # Permitir funções de ambiente interativo como display()
    "E702",    # Permitir múltiplas instruções por linha em plots interativos
    "E712",    # Permitir comparações literais em filtros interativos
    "B905",    # Zip sem strict em células exploratórias
    "NPY002",  # Sementes legadas de compatibilidade em notebooks
    "SIM105",  # Blocos try-except legados de compatibilidade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true