[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
typeCheckingMode = "strict"
executionEnvironments = [
  { root = "src" }
]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["."]
infer-with-first-use = false
check-unannotated-defs = true
infer-return-types = "never"

project-excludes = [
    ".venv/**"
]